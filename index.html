<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Game</title><style>body{margin:0;background:#10151c;color:#f2f6fa;font:16px system-ui;text-align:center}header{padding:18px}p{color:#aab7c5}canvas{display:block;width:min(94vw,960px);height:auto;margin:0 auto;border:2px solid #666;border-radius:8px;background:#808080}kbd{background:#293847;border:1px solid #617687;border-radius:4px;padding:2px 5px}</style></head><body><header><h1>Random Game</h1><p>First step: a simple grey platform and a player.</p></header><canvas id="game" width="960" height="600" aria-label="Move the white circular player with WASD or arrow keys"></canvas><p id="health" aria-live="polite">HP: 10 / 10</p><p>Move with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or the arrow keys.</p><script>(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height,p={x:W/2,y:H/2,r:22,speed:250},enemy={x:W*0.25,y:H*0.3,r:22},keys=new Set(),health=document.getElementById('health');let hp=10,touchingEnemy=false,last=0;function draw(){x.fillStyle='#808080';x.fillRect(0,0,W,H);x.strokeStyle='#707070';x.lineWidth=1;for(let a=0;a<=W;a+=40){x.beginPath();x.moveTo(a,0);x.lineTo(a,H);x.stroke()}for(let a=0;a<=H;a+=40){x.beginPath();x.moveTo(0,a);x.lineTo(W,a);x.stroke()}x.save();x.globalCompositeOperation='source-over';x.shadowBlur=0;x.strokeStyle='rgba(0,0,0,0)';x.fillStyle='#ffffff';x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();x.restore();const angle=Math.atan2(p.y-enemy.y,p.x-enemy.x);x.fillStyle='#ff0000';x.beginPath();x.arc(enemy.x,enemy.y,enemy.r,0,Math.PI*2);x.fill();x.fillStyle='#000000';x.beginPath();x.arc(enemy.x+Math.cos(angle)*14,enemy.y+Math.sin(angle)*14,4,0,Math.PI*2);x.fill()}function loop(t){const dt=Math.min((t-last)/1000,.04);last=t;let dx=0,dy=0;if(keys.has('w')||keys.has('arrowup'))dy--;if(keys.has('s')||keys.has('arrowdown'))dy++;if(keys.has('a')||keys.has('arrowleft'))dx--;if(keys.has('d')||keys.has('arrowright'))dx++;if(dx||dy){const m=Math.hypot(dx,dy);p.x+=dx/m*p.speed*dt;p.y+=dy/m*p.speed*dt}p.x=Math.max(p.r,Math.min(W-p.r,p.x));p.y=Math.max(p.r,Math.min(H-p.r,p.y));const colliding=Math.hypot(p.x-enemy.x,p.y-enemy.y)<p.r+enemy.r;if(colliding&&!touchingEnemy&&hp>0){hp--;health.textContent='HP: '+hp+' / 10'}touchingEnemy=colliding;draw();requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key.startsWith('Arrow'))e.preventDefault()});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());draw();requestAnimationFrame(loop)})();</script></body></html>
