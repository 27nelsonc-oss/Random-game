<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Game</title><style>body{margin:0;background:#10151c;color:#f2f6fa;font:16px system-ui;text-align:center}header{padding:18px}p{color:#aab7c5}canvas{display:block;width:min(94vw,960px);height:auto;margin:0 auto;border:2px solid #666;border-radius:8px;background:#808080;touch-action:none}kbd{background:#293847;border:1px solid #617687;border-radius:4px;padding:2px 5px}.levelup-overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.78)}.levelup-overlay[hidden]{display:none}.levelup-panel{width:min(760px,100%);padding:24px;box-sizing:border-box;background:#17212d;border:2px solid #738496;border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.5)}.levelup-panel h2{margin:0 0 8px}.levelup-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px} .levelup-card strong{display:inline-block;margin-bottom:10px;font-size:1.25rem}.levelup-card small{display:inline-block;font-size:.85rem;color:#c3d0dc;line-height:1.35}.levelup-card{min-height:150px;border:2px solid #718092;border-radius:9px;background:#263544;color:#f2f6fa;cursor:pointer;font:inherit;transition:background .12s,border-color .12s,transform .12s}.levelup-card:hover,.levelup-card:focus-visible{background:#34495b;border-color:#ffeb3b;transform:translateY(-2px);outline:none}.levelup-card:disabled{cursor:default;opacity:.55;transform:none}@media(max-width:520px){.levelup-panel{padding:16px}.levelup-cards{gap:8px}.levelup-card{min-height:115px;padding:6px}}</style></head><body><header><h1>Random Game</h1><p>First step: a simple grey platform and a player.</p></header><canvas id="game" width="960" height="600" aria-label="Move the white circular player with WASD, arrow keys, or touch drag"></canvas><div id="levelup" class="levelup-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="levelup-title"><div class="levelup-panel"><h2 id="levelup-title">Level Up!</h2><p>Choose 1 of 3 cards.</p><div class="levelup-cards"><button type="button" class="levelup-card" data-choice="0" aria-label="Choose Yoyo upgrade"><strong>Yoyo</strong><br><small>Throws a damaging yo-yo out and back</small></button><button type="button" class="levelup-card" data-choice="1" aria-label="Choose Ball upgrade"><strong>Ball</strong><br><small>Throws a ball every 5 seconds; hits one enemy for 2 damage, then bounces to another for 1 damage</small></button><button type="button" class="levelup-card" data-choice="2" aria-label="Choose card 3"></button></div></div></div><p id="health" aria-live="polite">HP: 10 / 10</p><p id="progress" aria-live="polite">Level: 0 | XP: 0 / 3</p><p>Move with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or the arrow keys. On a phone, touch and drag anywhere on the arena to move; release to stop.</p><script>(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height,p={x:W/2,y:H/2,r:22,speed:250},enemy={x:W*0.25,y:H*0.3,r:22,speed:180,hp:5,maxHp:5,respawnTimer:0},enemy2={x:W*0.75,y:H*0.7,r:22,speed:180,hp:5,maxHp:5,respawnTimer:0},enemies=[enemy,enemy2],enemyStartX=W*0.25,enemyStartY=H*0.3,enemy2StartX=W*0.75,enemy2StartY=H*0.7,projectiles=[],drops=[],keys=new Set(),health=document.getElementById('health'),progress=document.getElementById('progress'),levelup=document.getElementById('levelup'),levelupCards=Array.from(document.querySelectorAll('.levelup-card'));let mouseX=W/2+1,mouseY=H/2,level=0,xp=0,xpToNext=3,hp=10,levelupPending=0,gamePausedForChoice=false,yoyoOwned=false,yoyo=null,nextYoyoAt=0,ballOwned=false,ball=null,nextBallAt=0,nextDamageAt=0,nextShotAt=0,last=0,touchId=null,touchStartX=0,touchStartY=0,touchDX=0,touchDY=0;function restart(){level=0;xp=0;xpToNext=3;levelupPending=0;gamePausedForChoice=false;levelup.hidden=true;levelupCards.forEach(card=>card.disabled=false);yoyoOwned=false;yoyo=null;nextYoyoAt=0;ballOwned=false;ball=null;nextBallAt=0;progress.textContent='Level: 0 | XP: 0 / 3';hp=10;p.x=W/2;p.y=H/2;enemy.x=enemyStartX;enemy.y=enemyStartY;enemy.hp=enemy.maxHp;enemy.respawnTimer=0;enemy2.x=enemy2StartX;enemy2.y=enemy2StartY;enemy2.hp=enemy2.maxHp;enemy2.respawnTimer=0;projectiles=[];drops=[];nextDamageAt=0;nextShotAt=0;keys.clear();touchId=null;touchDX=0;touchDY=0;health.textContent='HP: 10 / 10';draw()}function chooseLevelUp(choice){if(levelupPending<=0)return;if(choice===0)yoyoOwned=true;if(choice===1){ballOwned=true;nextBallAt=0}levelupPending--;gamePausedForChoice=levelupPending>0;levelup.hidden=!gamePausedForChoice;levelupCards.forEach(card=>card.disabled=false);if(gamePausedForChoice)levelupCards[0].focus()}levelupCards.forEach(card=>card.addEventListener('click',()=>{if(!gamePausedForChoice&&levelupPending<=0)return;chooseLevelUp(Number(card.dataset.choice))}));function pointSegmentDistance(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay,len2=vx*vx+vy*vy;if(len2===0)return Math.hypot(px-ax,py-ay);const u=Math.max(0,Math.min(1,((px-ax)*vx+(py-ay)*vy)/len2));return Math.hypot(px-(ax+u*vx),py-(ay+u*vy))}function livingEnemies(){return enemies.filter(candidate=>candidate.hp>0)}function updateYoyo(dt,t){if(!yoyoOwned)return;if(!yoyo){const targets=livingEnemies();if(t<nextYoyoAt||targets.length===0)return;let target=targets[0],farthest=-1;for(const candidate of targets){const d=Math.hypot(candidate.x-p.x,candidate.y-p.y);if(d>farthest){farthest=d;target=candidate}}if(farthest<1)return;yoyo={x:p.x,y:p.y,dirX:(target.x-p.x)/farthest,dirY:(target.y-p.y)/farthest,length:farthest,distance:0,returning:false,hitTargets:new Set()}}if(!yoyo.returning){const step=650*dt;yoyo.x+=yoyo.dirX*step;yoyo.y+=yoyo.dirY*step;yoyo.distance+=step;if(yoyo.distance>=yoyo.length){const over=yoyo.distance-yoyo.length;yoyo.x-=yoyo.dirX*over;yoyo.y-=yoyo.dirY*over;yoyo.distance=yoyo.length;yoyo.returning=true;yoyo.hitTargets.clear()}}else{const dx=p.x-yoyo.x,dy=p.y-yoyo.y,d=Math.hypot(dx,dy),step=650*dt;if(d<=step||d<1){yoyo.x=p.x;yoyo.y=p.y}else if(d>0){yoyo.x+=dx/d*step;yoyo.y+=dy/d*step}}for(const target of livingEnemies()){if(!yoyo.hitTargets.has(target)&&pointSegmentDistance(target.x,target.y,p.x,p.y,yoyo.x,yoyo.y)<=target.r+8){target.hp=Math.max(0,target.hp-1);yoyo.hitTargets.add(target);if(target.hp===0){target.respawnTimer=2;drops.push({x:target.x,y:target.y})}}}if(yoyo&&yoyo.returning&&Math.hypot(p.x-yoyo.x,p.y-yoyo.y)<1){yoyo=null;nextYoyoAt=t+1800}}function updateBall(dt,t){if(!ballOwned)return;if(!ball){if(t<nextBallAt)return;const targets=livingEnemies();if(!targets.length)return;let target=null,nearest=Infinity;for(const candidate of targets){const d=Math.hypot(candidate.x-p.x,candidate.y-p.y);if(d<nearest){nearest=d;target=candidate}}if(!target)return;ball={x:p.x,y:p.y,target,phase:0,firstTarget:target};nextBallAt=t+5000}const target=ball.target;if(!target||target.hp<=0){if(ball.phase===0){const alternatives=livingEnemies().filter(candidate=>candidate!==ball.firstTarget);if(alternatives.length){ball.target=alternatives.reduce((best,candidate)=>Math.hypot(candidate.x-ball.x,candidate.y-ball.y)<Math.hypot(best.x-ball.x,best.y-ball.y)?candidate:best);ball.phase=1}else{ball=null;return}}else{ball=null;return}}const active=ball.target,dx=active.x-ball.x,dy=active.y-ball.y,d=Math.hypot(dx,dy),step=600*dt;if(d<=step||d<1){ball.x=active.x;ball.y=active.y;active.hp=Math.max(0,active.hp-(ball.phase===0?2:1));if(active.hp===0){active.respawnTimer=2;drops.push({x:active.x,y:active.y})}if(ball.phase===0){const alternatives=livingEnemies().filter(candidate=>candidate!==ball.firstTarget);if(alternatives.length){ball.target=alternatives.reduce((best,candidate)=>Math.hypot(candidate.x-ball.x,candidate.y-ball.y)<Math.hypot(best.x-ball.x,best.y-ball.y)?candidate:best);ball.phase=1}else ball=null}else ball=null}else if(d>0){ball.x+=dx/d*step;ball.y+=dy/d*step}}function draw(){x.fillStyle='#808080';x.fillRect(0,0,W,H);x.strokeStyle='#707070';x.lineWidth=1;for(let a=0;a<=W;a+=40){x.beginPath();x.moveTo(a,0);x.lineTo(a,H);x.stroke()}for(let a=0;a<=H;a+=40){x.beginPath();x.moveTo(0,a);x.lineTo(W,a);x.stroke()}x.save();x.globalCompositeOperation='source-over';x.shadowBlur=0;x.strokeStyle='rgba(0,0,0,0)';x.fillStyle='#ffffff';x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();x.restore();const facing=Math.atan2(mouseY-p.y,mouseX-p.x),eyeForward=10,eyeSide=5,eyeX=p.x+Math.cos(facing)*eyeForward,eyeY=p.y+Math.sin(facing)*eyeForward;x.fillStyle='#000000';for(const side of [-1,1]){x.beginPath();x.arc(eyeX-Math.sin(facing)*eyeSide*side,eyeY+Math.cos(facing)*eyeSide*side,4,0,Math.PI*2);x.fill()}for(const enemy of enemies){if(enemy.hp>0){const angle=Math.atan2(p.y-enemy.y,p.x-enemy.x);x.fillStyle='#ff0000';x.beginPath();x.arc(enemy.x,enemy.y,enemy.r,0,Math.PI*2);x.fill();x.fillStyle='#000000';x.beginPath();x.arc(enemy.x+Math.cos(angle)*14,enemy.y+Math.sin(angle)*14,4,0,Math.PI*2);x.fill();const bw=54,bh=7,bx=enemy.x-bw/2,by=enemy.y-enemy.r-14;x.fillStyle='#222222';x.fillRect(bx-1,by-1,bw+2,bh+2);x.fillStyle='#d92d2d';x.fillRect(bx,by,bw,bh);x.fillStyle='#35d05b';x.fillRect(bx,by,bw*(enemy.hp/enemy.maxHp),bh)}}if(yoyo){x.strokeStyle='#e8edf2';x.lineWidth=3;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(yoyo.x,yoyo.y);x.stroke();x.fillStyle='#ffeb3b';x.beginPath();x.arc(yoyo.x,yoyo.y,10,0,Math.PI*2);x.fill();x.strokeStyle='#9c8500';x.lineWidth=2;x.stroke()}if(ball){x.fillStyle='#3da5ff';x.beginPath();x.arc(ball.x,ball.y,8,0,Math.PI*2);x.fill();x.strokeStyle='#d7edff';x.lineWidth=2;x.stroke()}for(const shot of projectiles){x.fillStyle='#fff36b';x.beginPath();x.arc(shot.x,shot.y,6,0,Math.PI*2);x.fill()}for(const drop of drops){x.fillStyle='#ffeb3b';x.fillRect(drop.x-7,drop.y-7,14,14);x.strokeStyle='#b89b00';x.lineWidth=1;x.strokeRect(drop.x-7,drop.y-7,14,14)}if(hp===0){x.fillStyle='rgba(0,0,0,0.55)';x.fillRect(0,0,W,H);x.fillStyle='#ffffff';x.textAlign='center';x.font='bold 44px system-ui';x.fillText('Game Over',W/2,H/2-12);x.font='22px system-ui';x.fillText('Press any key or tap to restart',W/2,H/2+32)}}function loop(t){const dt=Math.min((t-last)/1000,.04);last=t;if(hp===0||gamePausedForChoice){draw();requestAnimationFrame(loop);return}for(const target of enemies){if(target.hp===0){target.respawnTimer-=dt;if(target.respawnTimer<=0){target.x=target===enemy?enemyStartX:enemy2StartX;target.y=target===enemy?enemyStartY:enemy2StartY;target.hp=target.maxHp;target.respawnTimer=0;nextShotAt=t+1000}}}let dx=0,dy=0;if(keys.has('w')||keys.has('arrowup'))dy--;if(keys.has('s')||keys.has('arrowdown'))dy++;if(keys.has('a')||keys.has('arrowleft'))dx--;if(keys.has('d')||keys.has('arrowright'))dx++;dx+=touchDX;dy+=touchDY;if(dx||dy){const m=Math.hypot(dx,dy);p.x+=dx/m*p.speed*dt;p.y+=dy/m*p.speed*dt}p.x=Math.max(p.r,Math.min(W-p.r,p.x));p.y=Math.max(p.r,Math.min(H-p.r,p.y));for(const target of livingEnemies()){const enemyDX=p.x-target.x,enemyDY=p.y-target.y,enemyDistance=Math.hypot(enemyDX,enemyDY);if(enemyDistance>0.001){const enemyStep=Math.min(target.speed*dt,enemyDistance);target.x+=(enemyDX/enemyDistance)*enemyStep;target.y+=(enemyDY/enemyDistance)*enemyStep;}target.x=Math.max(target.r,Math.min(W-target.r,target.x));target.y=Math.max(target.r,Math.min(H-target.r,target.y));}updateYoyo(dt,t);updateBall(dt,t);if(t>=nextShotAt){const targets=livingEnemies();let target=null,nearest=Infinity;for(const candidate of targets){const d=Math.hypot(candidate.x-p.x,candidate.y-p.y);if(d<nearest){nearest=d;target=candidate}}if(target&&nearest>0){projectiles.push({x:p.x,y:p.y,vx:(target.x-p.x)/nearest*500,vy:(target.y-p.y)/nearest*500,r:6,damage:1});nextShotAt=t+1000}}for(let i=projectiles.length-1;i>=0;i--){const s=projectiles[i];s.x+=s.vx*dt;s.y+=s.vy*dt;const hit= livingEnemies().find(target=>Math.hypot(s.x-target.x,s.y-target.y)<target.r+s.r);if(hit){hit.hp=Math.max(0,hit.hp-s.damage);if(hit.hp===0){hit.respawnTimer=2;drops.push({x:hit.x,y:hit.y})}projectiles.splice(i,1)}else if(s.x<0||s.x>W||s.y<0||s.y>H)projectiles.splice(i,1)}for(let i=drops.length-1;i>=0;i--){if(Math.hypot(p.x-drops[i].x,p.y-drops[i].y)<p.r+10){drops.splice(i,1);xp++;if(xp>=xpToNext){xp-=xpToNext;level++;xpToNext+=2;levelupPending++;gamePausedForChoice=true;levelup.hidden=false;levelupCards.forEach(card=>card.disabled=false);levelupCards[0].focus()}progress.textContent='Level: '+level+' | XP: '+xp+' / '+xpToNext}}const colliding=livingEnemies().some(target=>Math.hypot(p.x-target.x,p.y-target.y)<p.r+target.r);if(colliding&&t>=nextDamageAt&&hp>0){hp--;nextDamageAt=t+750;health.textContent='HP: '+hp+' / 10'}draw();requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{if(gamePausedForChoice){if(e.key==='Escape')e.preventDefault();return}if(hp===0){if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault();restart();return}keys.add(e.key.toLowerCase());if(e.key.startsWith('Arrow'))e.preventDefault()});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));function releaseTouch(e){if(e.pointerId===touchId){touchId=null;touchDX=0;touchDY=0}}c.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;if(hp===0){restart();e.preventDefault();return}if(touchId!==null)return;touchId=e.pointerId;touchStartX=e.clientX;touchStartY=e.clientY;touchDX=0;touchDY=0;c.setPointerCapture(e.pointerId);e.preventDefault()});c.addEventListener('pointermove',e=>{if(e.pointerId!==touchId)return;const dx=e.clientX-touchStartX,dy=e.clientY-touchStartY,m=Math.hypot(dx,dy),strength=Math.min(m/35,1);touchDX=m?dx/m*strength:0;touchDY=m?dy/m*strength:0;e.preventDefault()});c.addEventListener('pointerup',releaseTouch);c.addEventListener('pointercancel',releaseTouch);c.addEventListener('lostpointercapture',releaseTouch);window.addEventListener('blur',()=>{keys.clear();touchId=null;touchDX=0;touchDY=0});c.addEventListener('mousemove',e=>{const rect=c.getBoundingClientRect();mouseX=(e.clientX-rect.left)*W/rect.width;mouseY=(e.clientY-rect.top)*H/rect.height});draw();requestAnimationFrame(loop)})();</script></body></html>
