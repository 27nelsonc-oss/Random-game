<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Game</title><style>body{margin:0;background:#10151c;color:#f2f6fa;font:16px system-ui;text-align:center}header{padding:18px}p{color:#aab7c5}canvas{display:block;width:min(94vw,960px);height:auto;margin:0 auto;border:2px solid #666;border-radius:8px;background:#808080;touch-action:none}kbd{background:#293847;border:1px solid #617687;border-radius:4px;padding:2px 5px}</style></head><body><header><h1>Random Game</h1><p>First step: a simple grey platform and a player.</p></header><canvas id="game" width="960" height="600" aria-label="Move the white circular player with WASD, arrow keys, or touch drag"></canvas><p id="health" aria-live="polite">HP: 10 / 10</p><p>Move with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or the arrow keys. On a phone, touch and drag anywhere on the arena to move; release to stop.</p><script>(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height,p={x:W/2,y:H/2,r:22,speed:250},enemy={x:W*0.25,y:H*0.3,r:22,speed:180,hp:5,maxHp:5},enemyStartX=W*0.25,enemyStartY=H*0.3,projectiles=[],keys=new Set(),health=document.getElementById('health');let hp=10,nextDamageAt=0,nextShotAt=0,enemyRespawnAt=0,last=0,touchId=null,touchStartX=0,touchStartY=0,touchDX=0,touchDY=0;function restart(){hp=10;p.x=W/2;p.y=H/2;enemy.x=enemyStartX;enemy.y=enemyStartY;enemy.hp=enemy.maxHp;projectiles=[];enemyRespawnAt=0;nextDamageAt=0;nextShotAt=0;keys.clear();touchId=null;touchDX=0;touchDY=0;health.textContent='HP: 10 / 10';draw()}function draw(){x.fillStyle='#808080';x.fillRect(0,0,W,H);x.strokeStyle='#707070';x.lineWidth=1;for(let a=0;a<=W;a+=40){x.beginPath();x.moveTo(a,0);x.lineTo(a,H);x.stroke()}for(let a=0;a<=H;a+=40){x.beginPath();x.moveTo(0,a);x.lineTo(W,a);x.stroke()}x.save();x.globalCompositeOperation='source-over';x.shadowBlur=0;x.strokeStyle='rgba(0,0,0,0)';x.fillStyle='#ffffff';x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();x.restore();if(enemy.hp>0){const angle=Math.atan2(p.y-enemy.y,p.x-enemy.x);x.fillStyle='#ff0000';x.beginPath();x.arc(enemy.x,enemy.y,enemy.r,0,Math.PI*2);x.fill();x.fillStyle='#000000';x.beginPath();x.arc(enemy.x+Math.cos(angle)*14,enemy.y+Math.sin(angle)*14,4,0,Math.PI*2);x.fill();const bw=54,bh=7,bx=enemy.x-bw/2,by=enemy.y-enemy.r-14;x.fillStyle='#222222';x.fillRect(bx-1,by-1,bw+2,bh+2);x.fillStyle='#d92d2d';x.fillRect(bx,by,bw,bh);x.fillStyle='#35d05b';x.fillRect(bx,by,bw*(enemy.hp/enemy.maxHp),bh)}for(const shot of projectiles){x.fillStyle='#fff36b';x.beginPath();x.arc(shot.x,shot.y,6,0,Math.PI*2);x.fill()}if(hp===0){x.fillStyle='rgba(0,0,0,0.55)';x.fillRect(0,0,W,H);x.fillStyle='#ffffff';x.textAlign='center';x.font='bold 44px system-ui';x.fillText('Game Over',W/2,H/2-12);x.font='22px system-ui';x.fillText('Press any key or tap to restart',W/2,H/2+32)}}function loop(t){const dt=Math.min((t-last)/1000,.04);last=t;if(hp===0){draw();requestAnimationFrame(loop);return}if(enemy.hp===0&&t>=enemyRespawnAt){enemy.x=enemyStartX;enemy.y=enemyStartY;enemy.hp=enemy.maxHp;nextShotAt=t+1000}let dx=0,dy=0;if(keys.has('w')||keys.has('arrowup'))dy--;if(keys.has('s')||keys.has('arrowdown'))dy++;if(keys.has('a')||keys.has('arrowleft'))dx--;if(keys.has('d')||keys.has('arrowright'))dx++;dx+=touchDX;dy+=touchDY;if(dx||dy){const m=Math.hypot(dx,dy);p.x+=dx/m*p.speed*dt;p.y+=dy/m*p.speed*dt}p.x=Math.max(p.r,Math.min(W-p.r,p.x));p.y=Math.max(p.r,Math.min(H-p.r,p.y));const enemyDX=p.x-enemy.x,enemyDY=p.y-enemy.y,enemyDistance=Math.hypot(enemyDX,enemyDY);if(enemy.hp>0&&enemyDistance>0.001){const enemyStep=Math.min(enemy.speed*dt,enemyDistance);enemy.x+=(enemyDX/enemyDistance)*enemyStep;enemy.y+=(enemyDY/enemyDistance)*enemyStep;}enemy.x=Math.max(enemy.r,Math.min(W-enemy.r,enemy.x));enemy.y=Math.max(enemy.r,Math.min(H-enemy.r,enemy.y));if(enemy.hp>0&&t>=nextShotAt){const td=Math.hypot(enemy.x-p.x,enemy.y-p.y);if(td>0){projectiles.push({x:p.x,y:p.y,vx:(enemy.x-p.x)/td*500,vy:(enemy.y-p.y)/td*500,r:6,damage:1});nextShotAt=t+1000}}for(let i=projectiles.length-1;i>=0;i--){const s=projectiles[i];s.x+=s.vx*dt;s.y+=s.vy*dt;if(enemy.hp>0&&Math.hypot(s.x-enemy.x,s.y-enemy.y)<enemy.r+s.r){enemy.hp=Math.max(0,enemy.hp-s.damage);if(enemy.hp===0)enemyRespawnAt=t+2000;projectiles.splice(i,1)}else if(s.x<0||s.x>W||s.y<0||s.y>H)projectiles.splice(i,1)}const colliding=enemy.hp>0&&Math.hypot(p.x-enemy.x,p.y-enemy.y)<p.r+enemy.r;if(colliding&&t>=nextDamageAt&&hp>0){hp--;nextDamageAt=t+750;health.textContent='HP: '+hp+' / 10'}draw();requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{if(hp===0){if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault();restart();return}keys.add(e.key.toLowerCase());if(e.key.startsWith('Arrow'))e.preventDefault()});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));function releaseTouch(e){if(e.pointerId===touchId){touchId=null;touchDX=0;touchDY=0}}c.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;if(hp===0){restart();e.preventDefault();return}if(touchId!==null)return;touchId=e.pointerId;touchStartX=e.clientX;touchStartY=e.clientY;touchDX=0;touchDY=0;c.setPointerCapture(e.pointerId);e.preventDefault()});c.addEventListener('pointermove',e=>{if(e.pointerId!==touchId)return;const dx=e.clientX-touchStartX,dy=e.clientY-touchStartY,m=Math.hypot(dx,dy),strength=Math.min(m/35,1);touchDX=m?dx/m*strength:0;touchDY=m?dy/m*strength:0;e.preventDefault()});c.addEventListener('pointerup',releaseTouch);c.addEventListener('pointercancel',releaseTouch);c.addEventListener('lostpointercapture',releaseTouch);window.addEventListener('blur',()=>{keys.clear();touchId=null;touchDX=0;touchDY=0});draw();requestAnimationFrame(loop)})();</script></body></html>
