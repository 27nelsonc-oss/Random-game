<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Game</title><style>body{margin:0;background:#10151c;color:#f2f6fa;font:16px system-ui;text-align:center}header{padding:18px}p{color:#aab7c5}canvas{display:block;width:min(94vw,960px);height:auto;margin:0 auto;border:3px solid #83b99b;border-radius:12px;background:#294c40}kbd{background:#293847;border:1px solid #617687;border-radius:4px;padding:2px 5px}</style></head><body><header><h1>Random Game</h1><p>First step: a platform and a character you can move.</p></header><canvas id="game" width="960" height="600" aria-label="Move the character with WASD or arrow keys"></canvas><p>Move with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or the arrow keys.</p><script>(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height,p={x:W/2,y:H/2,r:17,speed:250},keys=new Set();let last=0;function draw(){x.fillStyle='#203d35';x.fillRect(0,0,W,H);x.fillStyle='#294c40';x.fillRect(18,18,W-36,H-36);x.strokeStyle='#355d4e';for(let a=38;a<W-18;a+=40){x.beginPath();x.moveTo(a,18);x.lineTo(a,H-18);x.stroke()}for(let a=38;a<H-18;a+=40){x.beginPath();x.moveTo(18,a);x.lineTo(W-18,a);x.stroke()}x.strokeStyle='#83b99b';x.lineWidth=4;x.strokeRect(18,18,W-36,H-36);x.fillStyle='#13271f';x.beginPath();x.ellipse(p.x,p.y+8,16,11,0,0,7);x.fill();x.fillStyle='#77e0b5';x.beginPath();x.roundRect(p.x-12,p.y-3,24,25,7);x.fill();x.fillStyle='#f0bd83';x.beginPath();x.arc(p.x,p.y-6,10,0,7);x.fill();x.fillStyle='#183027';x.beginPath();x.arc(p.x-3,p.y-7,1.7,0,7);x.arc(p.x+4,p.y-7,1.7,0,7);x.fill()}function loop(t){const dt=Math.min((t-last)/1000,.04);last=t;let dx=0,dy=0;if(keys.has('w')||keys.has('arrowup'))dy--;if(keys.has('s')||keys.has('arrowdown'))dy++;if(keys.has('a')||keys.has('arrowleft'))dx--;if(keys.has('d')||keys.has('arrowright'))dx++;if(dx||dy){const m=Math.hypot(dx,dy);p.x+=dx/m*p.speed*dt;p.y+=dy/m*p.speed*dt}p.x=Math.max(35,Math.min(W-35,p.x));p.y=Math.max(35,Math.min(H-35,p.y));draw();requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key.startsWith('Arrow'))e.preventDefault()});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());draw();requestAnimationFrame(loop)})();</script></body></html>
